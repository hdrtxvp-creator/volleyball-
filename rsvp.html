<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volleyball — sign-ups are back in WhatsApp</title>
<meta name="theme-color" content="#081525">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --ink:#081525; --panel:#10243F; --chalk:#E8EDF2; --ball:#F2C230; --slate:#7C8CA3 }
*{box-sizing:border-box}
body{
  margin:0;padding:24px 18px 60px;background:var(--ink);color:var(--chalk);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;line-height:1.55;
  max-width:560px;margin-inline:auto;-webkit-text-size-adjust:100%
}
h1{
  font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:30px;margin:0;
  letter-spacing:.02em;text-transform:uppercase
}
h1 em{color:var(--ball);font-style:normal;display:block}
p{color:#B9C6D6;font-size:16px}
.card{background:var(--panel);border-radius:12px;padding:18px;margin-top:22px}
.card p{margin:0;color:var(--chalk)}
.card p + p{margin-top:10px;color:#B9C6D6;font-size:14px}
.small{margin-top:22px;font-size:13px;color:var(--slate)}
</style>
</head>
<body>

<h1>Weekly<em>Volleyball</em></h1>

<div class="card">
  <p><b style="color:var(--ball)">Sign-ups have moved back to the group chat.</b></p>
  <p>There is nothing to tap here any more. Just reply in the WhatsApp group the way you used to, and whoever is sorting the teams will put you down.</p>
</div>

<p class="small">You can delete this page from your home screen — it does not do anything now.</p>

</body>
</html>
